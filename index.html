	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<script src="vendor/vue.global.js"></script>
	<script src="vendor/howler.min.js"></script>
	<link rel="stylesheet" href="vendor/reset.min.css" />
	<link rel="stylesheet" href="css/style.css" />
	<link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
	<!-- onclickがないとスマホでtouch-action: manipulation;が機能しないため -->
	<div id="main" onclick="void(0)">
		<div id="canvas-container">
			<canvas id="c0"></canvas>
		</div>
		<div id="app" v-cloak>
			<div style="text-align: center;" v-if="isMobile && !isLandscape">
				スマホを横にしてください
			</div>
			<details>
				<summary>操作説明</summary>
				<div id="operation-guide">
					<table>
						<thead>
							<tr>
								<th>キー</th>
								<th>操作</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td><kbd>Z</kbd></td>
								<td>攻撃・決定</td>
							</tr>
							<tr>
								<td><kbd>X</kbd></td>
								<td>ダッシュ・キャンセル</td>
							</tr>
							<tr>
								<td><kbd>A</kbd></td>
								<td>コマンドウィンドウ</td>
							</tr>
							<tr>
								<td><kbd>C</kbd></td>
								<td>向き変更</td>
							</tr>
							<tr>
								<td><kbd>Shift</kbd></td>
								<td>斜め移動・ソート</td>
							</tr>
							<tr>
								<td><kbd>S</kbd></td>
								<td>射撃</td>
							</tr>
							<tr>
								<td><kbd>Space</kbd></td>
								<td>地図</td>
							</tr>
							<tr>
								<td><kbd>F</kbd></td>
								<td>FF発動</td>
							</tr>
							<template v-if="!isMobile">
								<tr>
									<td><kbd>F2</kbd> / <kbd>F3</kbd></td>
									<td>BGM音量の調整</td>
								</tr>
								<tr>
									<td><kbd>F4</kbd> / <kbd>F5</kbd></td>
									<td>効果音音量の調整</td>
								</tr>
								<tr>
									<td><kbd>F7</kbd></td>
									<td>BGMのON/OFF</td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
			</details>
			<details v-if="!isMobile">
				<summary>ゲームパッド設定</summary>
				<div style="margin-bottom: 8px;">参考：<a href="https://hardwaretester.com/gamepad" target="_blank" rel="noopener noreferrer">Hexgaming ゲームパッド テスター</a></div>
				<div class="pad-button-config">
					<label>攻撃・決定</label>
					<input type="number" min="0" max="99" :value="attackButtonIndex" @change="onChangeAttackButtonIndex">
				</div>
				<div class="pad-button-config">
					<label>ダッシュ・キャンセル</label>
					<input type="number" min="0" max="99" :value="dashButtonIndex" @change="onChangeDashButtonIndex">
				</div>
				<div class="pad-button-config">
					<label>コマンドウィンドウ</label>
					<input type="number" min="0" max="99" :value="commandButtonIndex" @change="onChangeCommandButtonIndex">
				</div>
				<div class="pad-button-config">
					<label>向き変更</label>
					<input type="number" min="0" max="99" :value="turnButtonIndex" @change="onChangeTurnButtonIndex">
				</div>
				<div class="pad-button-config">
					<label>斜め移動</label>
					<input type="number" min="0" max="99" :value="diagonalButtonIndex" @change="onChangeDiagonalButtonIndex">
				</div>
				<div class="pad-button-config">
					<label>射撃</label>
					<input type="number" min="0" max="99" :value="shootButtonIndex" @change="onChangeShootButtonIndex">
				</div>
				<div class="pad-button-config">
					<label>地図</label>
					<input type="number" min="0" max="99" :value="mapButtonIndex" @change="onChangeMapButtonIndex">
				</div>
				<div class="pad-button-config">
					<label>FF</label>
					<input type="number" min="0" max="99" :value="ffButtonIndex" @change="onChangeFFButtonIndex">
				</div>
			</details>
			<details>
				<summary>お助け機能</summary>
				<div id="otasuke">
					<button @click="unlockAllDungeons">全ダンジョン開放</button>
					<button @click="completeEnemyBook">敵図鑑全登録</button>
					<div class="config">
						<label for="show-movement-path">移動経路表示</label>
						<input id="show-movement-path" type="checkbox" :checked="showMovementPath" @change="onChangeShowMovementPath">
					</div>
				</div>
			</details>
			<details v-if="canCheat">
				<summary>チート</summary>
				<div id="cheat">
					<div>
						※ 以下は整合性を無視しているためバグる可能性があります
					</div>
					<div class="config item-add-config">
						<select @change="onChangeアイテムジャンル($event.target.value)">
							<option v-for="(name, index) in アイテムジャンル一覧" :key="index" :value="name">{{ name }}</option>
						</select>
						<select :value="アイテム.name" @change="onChangeアイテム($event.target.selectedIndex)">
							<option v-for="(item, index) in アイテム一覧[アイテムジャンル]" :key="index" :value="item.name">{{ item.name }}</option>
						</select>
						<button @click="addItem">アイテム追加</button>
					</div>
					<div class="config">
						<label>現在階層</label>
						<input type="number" min="1" v-model="currentFloor">
						<button @click="changeCurrentFloor">変更</button>
					</div>
				</div>
			</details>
			<button class="pad-toggle" @click="togglePad" v-if="isMobile && isLandscape">
				{{ padEnabled ? "PAD ON" : "PAD OFF" }}
			</button>
			<div id="fps" v-show="isMobile && isLandscape && padEnabled"></div>
			<div
				class="pad-system"
				v-show="isMobile && isLandscape && padEnabled"
			>
				<button
					class="pad-button pad-system-button"
					@pointerdown="onPointerDown2($event, 16), onPointerDown2($event, 81)"
					@pointerup="onPointerUp2(16), onPointerUp2(81)"
					@pointercancel="onPointerUp2(16), onPointerUp2(81)"
				>
					Q
				</button>
				<button
					class="pad-button pad-system-button"
					@pointerdown="onPointerDown2($event, 89)"
					@pointerup="onPointerUp2(89)"
					@pointercancel="onPointerUp2(89)"
				>
					Y
				</button>
				<button
					class="pad-button pad-system-button"
					@pointerdown="onPointerDown2($event, 192)"
					@pointerup="onPointerUp2(192)"
					@pointercancel="onPointerUp2(192)"
				>
					@
				</button>
			</div>
			<div class="virtual-pad virtual-pad--left" v-show="isMobile && isLandscape && padEnabled">
				<div class="pad-util pad-util--gap">
					<button
						class="pad-button pad-s"
						@pointerdown="onPointerDown($event, 'var_658')"
						@pointerup="onPointerUp('var_658')"
						@pointercancel="onPointerUp('var_658')"
					>
						S
					</button>
					<button
						class="pad-button pad-f"
						@pointerdown="onPointerDown2($event, 70)"
						@pointerup="onPointerUp2(70)"
						@pointercancel="onPointerUp2(70)"
					>
						F
					</button>
				</div>
				<table class="pad-action pad-direction">
					<tr>
						<td>
							<button
								class="pad-button"
								@pointerdown="move(-1, -1, $event)"
								@pointerup="move(-1, -1)"
								@pointercancel="move(-1, -1)"
							>
							</button>
						</td>
						<td>
							<button
								class="pad-button"
								@pointerdown="move(0, -1, $event)"
								@pointerup="move(0, -1)"
								@pointercancel="move(0, -1)"
							>
								↑
							</button>
						</td>
						<td>
							<button
								class="pad-button"
								@pointerdown="move(1, -1, $event)"
								@pointerup="move(1, -1)"
								@pointercancel="move(1, -1)"
							>
							</button>
						</td>
					</tr>
					<tr>
						<td>
							<button
								class="pad-button"
								@pointerdown="move(-1, 0, $event)"
								@pointerup="move(-1, 0)"
								@pointercancel="move(-1, 0)"
							>
								←
							</button>
						</td>
						<td></td>
						<td>
							<button
								class="pad-button"
								@pointerdown="move(1, 0, $event)"
								@pointerup="move(1, 0)"
								@pointercancel="move(1, 0)"
							>
								→
							</button>
						</td>
					</tr>
					<tr>
						<td>
							<button
								class="pad-button"
								@pointerdown="move(-1, 1, $event)"
								@pointerup="move(-1, 1)"
								@pointercancel="move(-1, 1)"
							>
							</button>
						</td>
						<td>
							<button
								class="pad-button"
								@pointerdown="move(0, 1, $event)"
								@pointerup="move(0, 1)"
								@pointercancel="move(0, 1)"
							>
								↓
							</button>
						</td>
						<td>
							<button
								class="pad-button"
								@pointerdown="move(1, 1, $event)"
								@pointerup="move(1, 1)"
								@pointercancel="move(1, 1)"
							>
							</button>
						</td>
					</tr>
				</table>
			</div>
			<div class="virtual-pad virtual-pad--right" v-show="isMobile && isLandscape && padEnabled">
				<div class="pad-util pad-util--gap">
					<button
						class="pad-button pad-map"
						@pointerdown="onPointerDownMap($event)"
						@pointerup="onPointerUpMap()"
						@pointercancel="onPointerUpMap()"
					>
						MAP
					</button>
					<button
						class="pad-button pad-shift"
						@pointerdown="onPointerDown($event, 'var_659')"
						@pointerup="onPointerUp('var_659')"
						@pointercancel="onPointerUp('var_659')"
					>
						SHIFT
					</button>
				</div>
				<div class="pad-action">
					<button
						class="pad-button pad-button--circle pad-btn pad-a"
						@pointerdown="onPointerDown($event, 'var_657')"
						@pointerup="onPointerUp('var_657')"
						@pointercancel="onPointerUp('var_657')"
					>
						A
					</button>
					<button
						class="pad-button pad-button--circle pad-btn pad-c"
						@pointerdown="onPointerDown($event, 'var_660')"
						@pointerup="onPointerUp('var_660')"
						@pointercancel="onPointerUp('var_660')"
					>
						C
					</button>
					<button
						class="pad-button pad-button--circle pad-btn pad-z"
						@pointerdown="onPointerDown($event, 'var_655')"
						@pointerup="onPointerUp('var_655')"
						@pointercancel="onPointerUp('var_655')"
					>
						Z
					</button>
					<button
						class="pad-button pad-button--circle pad-btn pad-x"
						@pointerdown="onPointerDown($event, 'var_656')"
						@pointerup="onPointerUp('var_656')"
						@pointercancel="onPointerUp('var_656')"
					>
						X
					</button>
				</div>
			</div>
		</div>
	</div>
	<script src="src/utils.js"></script>
	<script src="src/classes.js"></script>
	<script src="src/sound.js"></script>
	<script src="src/item.js"></script>
	<script src="src/adapter.js"></script>
	<script src="src/func0.js"></script>
	<script src="src/func1.js"></script>
	<script src="src/func2.js"></script>
	<script src="src/func3.js"></script>
	<script src="src/func4.js"></script>
	<script src="src/func5.js"></script>
	<script src="src/func6.js"></script>
	<script src="src/func7.js"></script>
	<script src="src/func8.js"></script>
	<script src="src/func9.js"></script>
	<script src="src/main.js"></script>
</body>
</html>
