	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="howler.min.js"></script>
	<style type="text/css">
		body {
			margin: 8px 8px 16px 8px;
			background-color: black;
			color: white;
			font-size: 16px;
		}
		#main {
			width: fit-content;
			margin: 0 auto;
		}
		#canvas_container {
			margin-bottom: 16px;
		}
		canvas {
			user-select: none;
			image-rendering: pixelated;
		}
		#c0 {
			min-width: 340px;
			max-width: 600px;
			width: 100%;
		}
		details {
			margin-top: 8px;
		}
		summary {
			margin-bottom: 8px;
			font-size: 1.2rem;
		}
		.pad-button-config {
			display: flex;
		}
		.pad-button-config label {
			width: 10em;
			text-align: right;
			margin-right: 0.5em;
		}
		.pad-button-config input {
			width: 50px;
		}
		#cheat {
			display: flex;
			flex-direction: column;
			gap: 8px;
			align-items: flex-start;
		}
	</style>
</head>
<body>
	<div id="main">
		<div id="canvas_container">
			<canvas id="c0"></canvas>
		</div>
		<div id="config">
			<details>
				<summary>ゲームパッド設定</summary>
				<div style="margin-bottom: 8px;">参考：<a href="https://hardwaretester.com/gamepad" target="_blank" rel="noopener noreferrer">Hexgaming ゲームパッド テスター</a></div>
				<div class="pad-button-config">
					<label>攻撃・決定</label>
					<input type="number" min="0" max="99" :value="attackButtonId" @change="onChangeAttackButtonId">
				</div>
				<div class="pad-button-config">
					<label>ダッシュ・キャンセル</label>
					<input type="number" min="0" max="99" :value="dashButtonId" @change="onChangeDashButtonId">
				</div>
				<div class="pad-button-config">
					<label>コマンドウィンドウ</label>
					<input type="number" min="0" max="99" :value="commandButtonId" @change="onChangeCommandButtonId">
				</div>
				<div class="pad-button-config">
					<label>向き変更</label>
					<input type="number" min="0" max="99" :value="turnButtonId" @change="onChangeTurnButtonId">
				</div>
				<div class="pad-button-config">
					<label>斜め移動</label>
					<input type="number" min="0" max="99" :value="diagonalButtonId" @change="onChangeDiagonalButtonId">
				</div>
				<div class="pad-button-config">
					<label>射撃</label>
					<input type="number" min="0" max="99" :value="shootButtonId" @change="onChangeShootButtonId">
				</div>
				<div class="pad-button-config">
					<label>地図	</label>
					<input type="number" min="0" max="99" :value="mapButtonId" @change="onChangeMapButtonId">
				</div>
			</details>
			<details>
				<summary>チート</summary>
				<div id="cheat">
					<button @click="unlockAllDungeons">全ダンジョン開放</button>
					<div>
						<label for="show-movement-path">移動経路表示</label>
						<input id="show-movement-path" type="checkbox" :value="showMovementPath" @change="onChangeShowMovementPath">
					</div>
				</div>
			</details>
		</div>
	</div>
	<script src="classes.js"></script>
	<script src="sound.js"></script>
	<script src="adapter.js"></script>
	<script src="func0.js"></script>
	<script src="func1.js"></script>
	<script src="func2.js"></script>
	<script src="func3.js"></script>
	<script src="func4.js"></script>
	<script src="func5.js"></script>
	<script src="func6.js"></script>
	<script src="func7.js"></script>
	<script src="func8.js"></script>
	<script src="func9.js"></script>
	<script src="main.js"></script>
</body>
</html>
